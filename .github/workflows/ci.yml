name: Continuous Integration & Verification

on:
  push:
    branches: ["main", "hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test & Schema Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Run Test Suite
        run: npm test

      - name: Check Edition Schema
        run: npm run check:schema

      - name: Build Site Distribution
        run: npm run build
