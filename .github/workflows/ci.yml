name: Continuous Integration & Verification

on:
  push:
    branches: ["main", "hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test & Schema Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20

      - name: Run Test Suite
        run: npm test

      - name: Check Edition Schema
        run: npm run check:schema

      - name: Build Site Distribution
        run: npm run build
