name: Process Approved Offering

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-offering:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Offering
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const issue = context.payload.issue;
            const editionPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'edition.json');

            const { parseOffering, validateOffering, inscribeOffering } = await import(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'ingest-offering.mjs'));

            const parsed = parseOffering(issue.body);
            const validated = validateOffering({ ...parsed, id: issue.number });

            if (!validated.valid) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ Offering rejected: ${validated.reason}`
              });
              core.setFailed(`Offering rejected: ${validated.reason}`);
              return;
            }

            inscribeOffering(editionPath, validated.offering, { commit: true, push: true, cwd: process.env.GITHUB_WORKSPACE });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✨ Offering #${issue.number} approved and inscribed into the edition ledger! Words: "${validated.offering.words.join(' ')}"`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
