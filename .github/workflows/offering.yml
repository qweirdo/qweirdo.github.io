name: Process Approved Offering

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  process-offering:
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Offering
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const issue = context.payload.issue;
            const body = issue.body || '';

            // Comprehensive Content Security Definitions (Political Extremism, Terror, Hate & Religious Blasphemy)
            const SUB = 'fuck shit bitch cunt pussy asshole whore slut dick cock retard rape porn wank twat fck fuk nigg fag kike chink spic gook nazi hitler swastik aryan whitepower kkk fascis gestapo holocaust apartheid genocid terror jihad isis isil daesh alqaeda taliban hamas hezbollah insurrect assassin boko blasphem sacrileg desecrat defile burnquran burnbible kaffir kafir infidel sedition extremist dhimmi heretic'.split(' ');
            const BAD = new Set('ass sex cum tits piss'.split(' '));
            const norm = w => String(w).toLowerCase().replace(/0/g,'o').replace(/[1!|]/g,'i').replace(/3/g,'e').replace(/[4@]/g,'a').replace(/[5$]/g,'s').replace(/[^a-z]/g,'');
            const isBad = w => { const n = norm(w); return !n || BAD.has(n) || SUB.some(s => n.includes(s)); };

            function getField(label) {
              const regex = new RegExp(`###\\s*${label}\\s*\\n\\n([^#]+)`, 'i');
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const rawWords = getField('Five Words');
            const rawName = getField('Display Name');
            const rawLink = getField('Optional Link');

            if (!rawWords) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ Offering rejected: Missing words.'
              });
              return;
            }

            const words = rawWords.split(/\s+/).filter(Boolean);
            if (words.length < 1 || words.length > 5) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `❌ Offering rejected: Must contain between 1 and 5 words (found ${words.length}).`
              });
              return;
            }

            for (const w of words) {
              if (w.length > 24) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `❌ Offering rejected: Word "${w}" exceeds 24 characters.`
                });
                return;
              }
              if (isBad(w)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: '❌ Offering rejected: Content contains politically sensitive, religiously blasphemous, or restricted terms.'
                });
                return;
              }
            }

            if (rawName && rawName.split(/\s+/).some(isBad)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '❌ Offering rejected: Contributor name contains politically sensitive or restricted terms.'
              });
              return;
            }

            const name = (rawName || 'Anonymous Scribe').slice(0, 60);
            let link = (rawLink === '_No response_' ? '' : rawLink).trim();
            if (link && !/^https?:\/\//i.test(link)) link = '';

            const editionDir = path.join(process.env.GITHUB_WORKSPACE, 'data');
            const editionFile = path.join(editionDir, 'edition.json');
            let edition = [];
            if (fs.existsSync(editionFile)) {
              try {
                edition = JSON.parse(fs.readFileSync(editionFile, 'utf8'));
              } catch (e) { edition = []; }
            }
            if (!Array.isArray(edition)) edition = [];

            const offering = {
              id: issue.number,
              words: words,
              name: name,
              link: link,
              ts: new Date().toISOString()
            };

            const existingIdx = edition.findIndex(e => e.id === issue.number);
            if (existingIdx >= 0) {
              edition[existingIdx] = offering;
            } else {
              edition.push(offering);
            }

            fs.mkdirSync(editionDir, { recursive: true });
            fs.writeFileSync(editionFile, JSON.stringify(edition, null, 2) + '\n', 'utf8');

            const { execSync } = require('child_process');
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add data/edition.json');
            execSync(`git commit -m "Inscribe offering #${issue.number} by ${name}"`);
            execSync('git push');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `✨ Offering #${issue.number} approved and inscribed into the edition ledger! Words: "${words.join(' ')}"`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: 'closed'
            });
