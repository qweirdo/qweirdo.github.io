name: Process Approved Offering

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: offering-ingest
  cancel-in-progress: false

jobs:
  process-offering:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Process Offering
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const path = require('path');
            const issue = context.payload.issue;
            const action = context.payload.action;
            const editionPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'edition.json');

            const { parseOffering, validateOffering, inscribeOffering } = await import(path.join(process.env.GITHUB_WORKSPACE, 'scripts', 'ingest-offering.mjs'));

            const parsed = parseOffering(issue.body);
            const validated = validateOffering({ ...parsed, id: issue.number });

            // On initial issue open, post preview for maintainers
            if (action === 'opened') {
              if (validated.valid) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `📋 **Offering Preview:**\n- **Words:** \`${validated.offering.words.join(' ')}\`\n- **Contributor:** \`${validated.offering.name}\`\n- **Link:** ${validated.offering.link || '_none_'}\n\n*A maintainer will review and add the \`approved\` label to inscribe this offering into the permanent ledger.*`
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `⚠️ **Offering Validation Notice:**\n${validated.reason}\nPlease update the issue description to conform to ledger constraints.`
                });
              }
              return;
            }

            // On labeled event: process only if approved label was applied
            if (action === 'labeled') {
              const labelName = context.payload.label ? context.payload.label.name : '';
              if (labelName !== 'approved') return;

              if (!validated.valid) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `❌ **Offering Rejected:**\n${validated.reason}`
                });
                core.setFailed(`Offering rejected: ${validated.reason}`);
                return;
              }

              inscribeOffering(editionPath, validated.offering, { commit: true, push: true, cwd: process.env.GITHUB_WORKSPACE });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✨ **Offering Inscribed:**\nOffering #${issue.number} has been permanently etched into the edition ledger!\nWords: \`${validated.offering.words.join(' ')}\`\nContributor: \`${validated.offering.name}\``
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
